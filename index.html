<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DS-Algo Playground</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar__header">
      <a href="index.html" class="sidebar__logo">
        <svg width="28" height="28" viewBox="0 0 32 32">
          <rect width="32" height="32" rx="6" fill="#3b82f6"/>
          <text x="16" y="22" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="16" fill="white">&lt;/&gt;</text>
        </svg>
        DS-Algo
      </a>
    </div>

    <!-- Tab strip -->
    <div class="sidebar-tabs">
      <button class="sidebar-tab sidebar-tab--active" data-sidebar-tab="roadmap">Roadmap</button>
      <button class="sidebar-tab" data-sidebar-tab="topics">Topics</button>
      <button class="sidebar-tab" data-sidebar-tab="tools">Tools</button>
    </div>

    <!-- Roadmap tab content -->
    <div class="sidebar-tab-content" data-sidebar-content="roadmap">
      <!-- populated by sidebar-tabs.js -->
    </div>

    <!-- Topics tab content -->
    <div class="sidebar-tab-content sidebar-tab-content--hidden" data-sidebar-content="topics">
      <!-- populated by sidebar-tabs.js -->
    </div>

    <!-- Tools tab content -->
    <div class="sidebar-tab-content sidebar-tab-content--hidden" data-sidebar-content="tools">
      <!-- populated by sidebar-tabs.js -->
    </div>

    <div class="sidebar__footer">
      <span style="font-size:var(--font-size-sm);color:var(--text-tertiary);">
        Press <strong>?</strong> for shortcuts
      </span>
    </div>
  </aside>

  <div class="sidebar-overlay"></div>

  <!-- Main Content -->
  <div class="main">
    <header class="main__header">
      <button class="hamburger" aria-label="Toggle menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="search-container">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" class="search-input" placeholder="Search topics and problems...">
        <span class="search-shortcut">/</span>
        <div class="search-results"></div>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" aria-label="Toggle theme"></button>
      </div>
    </header>

    <div class="main__content">
      <!-- Overall progress -->
      <div class="roadmap-header">
        <div class="roadmap-header__stats">
          <span class="roadmap-solved-count">0/0 solved</span>
          <span class="roadmap-solved-pct">0%</span>
        </div>
        <div class="roadmap-progress-bar">
          <div class="roadmap-progress-bar__fill" style="width:0%"></div>
        </div>
      </div>

      <!-- Pattern sections — populated by roadmap.js -->
      <div id="roadmap-sections">
        <div class="roadmap-loading">Loading roadmap...</div>
      </div>
    </div>
  </div>

  <!-- Shortcuts Modal -->
  <div class="modal-overlay shortcuts-modal">
    <div class="modal">
      <div class="modal__header">
        <h3 class="modal__title">Keyboard Shortcuts</h3>
        <button class="modal__close" onclick="this.closest('.modal-overlay').classList.remove('active')">&times;</button>
      </div>
      <div class="shortcuts-list">
        <span class="shortcut-key">t</span><span>Toggle theme</span>
        <span class="shortcut-key">/</span><span>Focus search</span>
        <span class="shortcut-key">?</span><span>Show shortcuts</span>
        <span class="shortcut-key">Esc</span><span>Close modal</span>
      </div>
    </div>
  </div>

  <script src="js/problem-progress.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/search.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/sidebar-tabs.js"></script>
  <script src="js/roadmap.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (DSA.theme)    DSA.theme.init();
      if (DSA.sidebar)  DSA.sidebar.init();
      if (DSA.search)   DSA.search.init();
      if (DSA.keyboard) DSA.keyboard.init();
      if (DSA.roadmap)  DSA.roadmap.init();
    });
  </script>
</body>
</html>
